<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 284" role="img" aria-label="Scattered agent sessions on the left flow into the lane engine, which compacts them into per-user lanes; the panel on the right compares users by peak concurrency, leverage, and run versus wait.">
  <defs>
    <!-- vvibe agent tracker light palette (tuned for white GitHub READMEs)
         brand blue #2a78d6 · deep #104281 · ink #1c1c24 · success #15803d · warning #b45309 -->

    <marker id="vm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#15803d"/>
    </marker>

    <radialGradient id="vm-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#2a78d6" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#2a78d6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#2a78d6" stop-opacity="0"/>
    </radialGradient>

    <style>
      .pulse   { animation: p 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes p { 0%,100% { opacity: 1 } 50% { opacity: 0.4 } }
      .pulse2  { animation: p 2s ease-in-out infinite; animation-delay: 0.6s; transform-origin: center; transform-box: fill-box; }
      .pulse3  { animation: p 2s ease-in-out infinite; animation-delay: 1.2s; transform-origin: center; transform-box: fill-box; }
      .flow    { stroke-dasharray: 5 7; animation: mv 1.4s linear infinite; }
      @keyframes mv { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -24 } }
      .heartbeat { animation: hb 1.3s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes hb { 0%,100% { transform: scale(1) } 50% { transform: scale(1.12) } }
      .spin    { animation: sp 12s linear infinite; transform-origin: 420px 160px; }
      @keyframes sp { to { transform: rotate(360deg) } }
      .spin-r  { animation: sp-r 18s linear infinite; transform-origin: 420px 160px; }
      @keyframes sp-r { to { transform: rotate(-360deg) } }
      /* a lane segment that is running right now */
      .live    { animation: lv 2s ease-in-out infinite; }
      @keyframes lv { 0%,100% { opacity: 1 } 50% { opacity: 0.35 } }
    </style>
  </defs>

  <!-- section labels -->
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing="0.22em" font-weight="700">
    <text x="28"  y="30" fill="#2a78d6">SESSIONS · RAW</text>
    <text x="420" y="30" fill="#104281" text-anchor="middle">LANE ENGINE · 30 MIN</text>
    <text x="852" y="30" fill="#15803d" text-anchor="end">COMPARE · PER USER</text>
  </g>

  <!-- ====================== LEFT: SCATTERED SESSIONS ====================== -->
  <g font-family="Inter, -apple-system, system-ui, sans-serif">
    <g transform="translate(16,52)">
      <rect x="0" y="0" width="300" height="48" rx="10" fill="rgba(42,120,214,0.08)"/>
      <g transform="translate(22,24)">
        <rect x="-8" y="-6" width="16" height="4" rx="2" fill="#2a78d6"/>
        <rect x="-8" y="2"  width="10" height="4" rx="2" fill="#2a78d6" opacity="0.55"/>
      </g>
      <text x="48" y="22" font-size="14" font-weight="700" fill="#1c1c24">Stripe login UI check</text>
      <text x="48" y="38" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="rgba(28,28,36,0.65)">RY · 271 turns · 70m tok · <tspan fill="#15803d" font-weight="700">now</tspan></text>
      <circle class="pulse" cx="284" cy="24" r="4.2" fill="#2a78d6"/>
    </g>

    <g transform="translate(16,108)">
      <rect x="0" y="0" width="300" height="48" rx="10" fill="rgba(28,28,36,0.05)"/>
      <g transform="translate(22,24)">
        <path d="M0 -8 L8 6 L-8 6 Z" fill="none" stroke="#d1541f" stroke-width="1.6" stroke-linejoin="round"/>
        <rect x="-0.8" y="-2" width="1.6" height="4.4" rx="0.8" fill="#d1541f"/>
        <circle cx="0" cy="3.6" r="0.9" fill="#d1541f"/>
      </g>
      <text x="48" y="22" font-size="14" font-weight="700" fill="#1c1c24">fix(alert): #4353</text>
      <text x="48" y="38" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="rgba(28,28,36,0.65)">RY · 67 turns · 6.7m tok · <tspan fill="#15803d" font-weight="700">2m</tspan></text>
      <circle class="pulse2" cx="284" cy="24" r="4.2" fill="#d1541f"/>
    </g>

    <g transform="translate(16,164)">
      <rect x="0" y="0" width="300" height="48" rx="10" fill="rgba(27,175,122,0.09)"/>
      <g transform="translate(22,24)">
        <path d="M0 -9 L2.4 -2.4 L9 0 L2.4 2.4 L0 9 L-2.4 2.4 L-9 0 L-2.4 -2.4 Z" fill="#0e8a5f"/>
      </g>
      <text x="48" y="22" font-size="14" font-weight="700" fill="#1c1c24">Optimize onboarding</text>
      <text x="48" y="38" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="rgba(28,28,36,0.65)">MC · 337 turns · 47m tok · <tspan fill="#15803d" font-weight="700">now</tspan></text>
      <circle class="pulse3" cx="284" cy="24" r="4.2" fill="#0e8a5f"/>
    </g>

    <g transform="translate(16,220)">
      <rect x="0" y="0" width="300" height="48" rx="10" fill="rgba(232,123,164,0.10)"/>
      <g transform="translate(22,24)">
        <rect x="-8" y="0"  width="4" height="8"  rx="1.5" fill="#d15586"/>
        <rect x="-2" y="-4" width="4" height="12" rx="1.5" fill="#d15586"/>
        <rect x="4"  y="-8" width="4" height="16" rx="1.5" fill="#d15586"/>
      </g>
      <text x="48" y="22" font-size="14" font-weight="700" fill="#1c1c24">Mixpanel events migration</text>
      <text x="48" y="38" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="rgba(28,28,36,0.65)">JC · 488 turns · 70m tok · <tspan fill="#15803d" font-weight="700">1h</tspan></text>
      <circle class="pulse" cx="284" cy="24" r="4.2" fill="#d15586" style="animation-delay:1.5s"/>
    </g>
  </g>

  <!-- ===== flow lines: sessions -> lane engine ===== -->
  <g stroke="#2a78d6" stroke-opacity="0.45" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path class="flow" d="M316 76  C 350 76,  360 140, 372 152"/>
    <path class="flow" d="M316 132 C 340 132, 354 148, 368 157" style="animation-delay:0.3s"/>
    <path class="flow" d="M316 188 C 340 188, 354 172, 368 163" style="animation-delay:0.6s"/>
    <path class="flow" d="M316 244 C 350 244, 360 180, 372 168" style="animation-delay:0.9s"/>
  </g>

  <!-- ====================== CENTER: LANE ENGINE ====================== -->
  <g>
    <circle cx="420" cy="160" r="96" fill="url(#vm-glow)"/>

    <circle class="spin-r" cx="420" cy="160" r="76" fill="none" stroke="#2a78d6" stroke-opacity="0.28" stroke-width="1.4" stroke-dasharray="2 9" stroke-linecap="round"/>

    <g class="spin" opacity="0.5">
      <circle cx="420" cy="90"  r="4" fill="#2a78d6"/>
      <circle cx="490" cy="160" r="4" fill="#2a78d6"/>
      <circle cx="420" cy="230" r="4" fill="#2a78d6"/>
      <circle cx="350" cy="160" r="4" fill="#2a78d6"/>
    </g>

    <!-- lane compactor: three lanes, segments packed, one running live -->
    <g>
      <rect x="372" y="122" width="96" height="76" rx="14" fill="#1c1c24"/>
      <rect x="382" y="137" width="76" height="4" rx="2" fill="rgba(255,255,255,0.14)"/>
      <rect x="382" y="157" width="76" height="4" rx="2" fill="rgba(255,255,255,0.14)"/>
      <rect x="382" y="177" width="76" height="4" rx="2" fill="rgba(255,255,255,0.14)"/>
      <rect x="382" y="135" width="26" height="8" rx="4" fill="#5598e7"/>
      <rect x="412" y="135" width="18" height="8" rx="4" fill="#9085e9"/>
      <rect x="434" y="135" width="20" height="8" rx="4" fill="#e66767"/>
      <rect x="382" y="155" width="16" height="8" rx="4" fill="#eda100"/>
      <rect class="live" x="402" y="155" width="22" height="8" rx="4" fill="#e87ba4"/>
      <rect x="382" y="175" width="32" height="8" rx="4" fill="#1baf7a"/>
    </g>

    <!-- wordmark -->
    <text x="420" y="258" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="-0.02em" fill="#1c1c24">vvibe</text>
    <text x="420" y="277" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#2a78d6" text-anchor="middle" letter-spacing="0.22em" font-weight="700">WHO RUNS · HOW WELL</text>
  </g>

  <!-- ===== flow line: engine -> comparison ===== -->
  <g stroke="#15803d" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path class="flow" d="M474 160 C 502 160, 516 154, 542 150" marker-end="url(#vm-arrow)" style="animation-delay:0.5s"/>
  </g>

  <!-- ====================== RIGHT: PER-USER COMPARISON ====================== -->
  <g transform="translate(556,56)">
    <rect x="0" y="0" width="296" height="192" rx="12" fill="rgba(16,66,129,0.06)"/>
    <text x="14" y="21" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#104281" letter-spacing="0.18em" font-weight="700">USER LANES · THIS WEEK</text>
    <circle class="pulse" cx="280" cy="17" r="4" fill="#2a78d6"/>

    <!-- RY: two lanes, peak 4 -->
    <g transform="translate(14,34)">
      <circle cx="10" cy="12" r="10" fill="#1a9e57"/>
      <text x="10" y="15" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#ffffff" text-anchor="middle">AL</text>
      <rect x="30" y="2"  width="180" height="6" rx="3" fill="rgba(28,28,36,0.06)"/>
      <rect x="30" y="1"  width="28" height="8" rx="4" fill="#2a78d6"/>
      <rect x="64" y="1"  width="20" height="8" rx="4" fill="#4a3aa7"/>
      <rect x="90" y="1"  width="14" height="8" rx="4" fill="#eda100"/>
      <rect x="30" y="16" width="180" height="6" rx="3" fill="rgba(28,28,36,0.06)"/>
      <rect x="30" y="15" width="18" height="8" rx="4" fill="#e34948"/>
      <rect class="live" x="54" y="15" width="24" height="8" rx="4" fill="#e87ba4"/>
      <g class="heartbeat">
        <rect x="222" y="3" width="60" height="17" rx="8.5" fill="#104281"/>
        <text x="252" y="15" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">PEAK 4</text>
      </g>
    </g>

    <!-- MC: one lane, peak 3 -->
    <g transform="translate(14,84)">
      <circle cx="10" cy="10" r="10" fill="#3d3d63"/>
      <text x="10" y="13" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#ffffff" text-anchor="middle">BR</text>
      <rect x="30" y="5" width="180" height="6" rx="3" fill="rgba(28,28,36,0.06)"/>
      <rect x="30" y="4" width="32" height="8" rx="4" fill="#1baf7a"/>
      <rect x="68" y="4" width="16" height="8" rx="4" fill="#eb6834"/>
      <rect x="222" y="1" width="60" height="17" rx="8.5" fill="#2a78d6"/>
      <text x="252" y="13" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">PEAK 3</text>
    </g>

    <!-- JC: one lane, peak 2 -->
    <g transform="translate(14,118)">
      <circle cx="10" cy="10" r="10" fill="#8b7cf6"/>
      <text x="10" y="13" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#ffffff" text-anchor="middle">KP</text>
      <rect x="30" y="5" width="180" height="6" rx="3" fill="rgba(28,28,36,0.06)"/>
      <rect x="30" y="4" width="24" height="8" rx="4" fill="#e87ba4"/>
      <rect x="60" y="4" width="10" height="8" rx="4" fill="#1baf7a"/>
      <rect x="222" y="1" width="60" height="17" rx="8.5" fill="#dcebfb"/>
      <text x="252" y="13" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#1c5cab" text-anchor="middle">PEAK 2</text>
    </g>

    <line x1="14" y1="150" x2="282" y2="150" stroke="rgba(28,28,36,0.12)" stroke-width="1"/>

    <text x="14" y="166" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="rgba(28,28,36,0.55)" letter-spacing="0.18em" font-weight="700">LEVERAGE · RUN VS WAIT</text>
    <text x="14" y="183" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="rgba(28,28,36,0.7)">leverage <tspan fill="#1c1c24" font-weight="700">1.4×</tspan> · run avg <tspan fill="#15803d" font-weight="700">40m</tspan> · wait avg <tspan fill="#b45309" font-weight="700">20m</tspan></text>
  </g>

  <text x="704" y="264" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="rgba(28,28,36,0.55)" text-anchor="middle" letter-spacing="0.18em">ONE LANE PER AGENT · CLICK ANY SEGMENT</text>
</svg>
